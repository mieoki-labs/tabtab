<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabTab</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #16191d; --ink-2: #5b6470; --line: #e3e6ea; --accent: #2455e6; --on: #fff; --soft: #edf2ff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111316; --card: #1a1d21; --ink: #eef0f2; --ink-2: #9aa3ae; --line: #2c3036; --accent: #7ea2ff; --on: #0d1422; --soft: #1f2a42; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { width: 100%; max-width: 440px; padding: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; text-align: center; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 14px; }
  .byebye { font-size: 16px; font-weight: 600; color: var(--accent); }
  .mark { flex: none; width: 24px; height: 24px; }
  .mark svg { display: block; width: 24px; height: 24px; border-radius: 6px; box-shadow: 0 0 0 1px #2455e6; }
  h1 { margin: 0 0 4px; font-size: 21px; line-height: 1.35; letter-spacing: -.015em; }
  .lead { margin: 0 0 16px; color: var(--ink-2); }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 12px; }
  .chip { cursor: pointer; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: block; padding: 7px 12px; border: 1px solid var(--line); border-radius: 99px; font-size: 13px; transition: background .12s, border-color .12s; }
  .chip:hover span { border-color: var(--ink-2); }
  .chip input:checked + span { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=text] { width: 100%; margin: 0 0 12px; padding: 9px 12px; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 9px; font: inherit; font-size: 14px; }
  input[type=text]::placeholder { color: var(--ink-2); }
  button { width: 100%; padding: 10px; color: var(--on); background: var(--accent); border: 0; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .note { margin: 10px 0 0; color: var(--ink-2); font-size: 12px; }
  .note a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="brand"><div class="mark">
    <svg viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="LOGO"><rect width="32" height="32" rx="7.5"/></clipPath></defs><g clip-path="url(#LOGO)"><rect width="32" height="32" fill="#2455E6"/><path d="M0 32V9h12a6 6 0 0 1 6 6v17z" fill="#fff"/><path d="M32 32V9h-3a6 6 0 0 0-6 6v17z" fill="#B7C8FB"/><circle cx="9" cy="15.5" r="2.8" fill="#2455E6"/></g></svg>
  </div><span class="byebye">TabTab ByeBye 👋</span></div>
  <h1 data-ko="TabTab을 삭제했어요 😢">Sorry to see you go 😢</h1>
  <form id="form">
    <p class="lead" data-ko="이유를 알려주시겠어요?">Mind telling me why?</p>
    <div class="chips" id="chips"></div>
    <input type="text" id="more" maxlength="500" placeholder="Anything else? (optional)" data-ko-ph="더 하고 싶은 말이 있다면 (선택)">
    <button type="submit" id="send" disabled data-ko="보내기">Send</button>
    <p class="note"><span data-ko="익명이에요. 이름이나 이메일은 필요 없어요.">Anonymous. No name or email needed.</span> <a id="reinstall" target="_blank" rel="noopener" data-ko="다시 설치하기" hidden>Reinstall TabTab</a></p>
  </form>
</main>
<script>
  // value는 구글 설문의 선택지와 정확히 같아야 한다
  const REASONS = [
    ['Too complicated', '너무 복잡해요'],
    ['Too many bugs', '버그가 많아요'],
    ["Didn't sort or close tabs the way I wanted", '원하는 대로 정리되지 않았어요'],
    ['Missing a feature', '필요한 기능이 없어요'],
    ['Found another app', '다른 앱을 찾았어요'],
    ["Didn't need it", '필요하지 않았어요'],
  ];
  const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSe_Ur2uRe2Lkz4PyuPnekFfGCL7ffbS-_vaw2f4XQzkV_iZZA/formResponse';
  const REASON_ENTRY = 'entry.1394793132';
  const MORE_ENTRY = 'entry.1002713445';
  const REINSTALL_URL = ''; // 스토어 주소가 나오면 채운다

  const ko = (navigator.language || '').toLowerCase().startsWith('ko');
  if (ko) {
    document.documentElement.lang = 'ko';
    document.querySelectorAll('[data-ko]').forEach(n => { n.textContent = n.dataset.ko; });
    document.querySelectorAll('[data-ko-ph]').forEach(n => { n.placeholder = n.dataset.koPh; });
  }
  const chips = document.getElementById('chips');
  const send = document.getElementById('send');
  const more = document.getElementById('more');
  for (const [value, korean] of REASONS) {
    const label = document.createElement('label');
    label.className = 'chip';
    const box = Object.assign(document.createElement('input'), { type: 'checkbox', value });
    const text = Object.assign(document.createElement('span'), { textContent: ko ? korean : value });
    label.append(box, text);
    chips.append(label);
  }
  const picked = () => [...chips.querySelectorAll('input:checked')].map(b => b.value);
  const update = () => { send.disabled = !picked().length && !more.value.trim(); };
  chips.addEventListener('change', update);
  more.addEventListener('input', update);
  if (REINSTALL_URL) {
    const a = document.getElementById('reinstall');
    a.href = REINSTALL_URL;
    a.hidden = false;
  }
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const body = new URLSearchParams();
    picked().forEach(v => body.append(REASON_ENTRY, v));
    if (more.value.trim()) body.append(MORE_ENTRY, more.value.trim());
    // 구글 설문은 응답 내용을 돌려주지 않는다. 그래서 성공 여부와 상관없이 고맙다고 표시한다
    fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body }).catch(() => {});
    e.target.hidden = true;
    document.querySelector('.byebye').textContent = 'TabTab';
    document.querySelector('h1').replaceChildren(ko ? '알려주셔서 고마워요.' : 'Thank you for telling me.', document.createElement('br'), ko ? '다시 만나길 바라요 👻' : 'Hope to see you again 👻');
    const close = Object.assign(document.createElement('p'), { className: 'note', textContent: ko ? '이제 이 창을 닫아도 돼요.' : 'You can close this window now.' });
    document.querySelector('main').append(close);
  });
</script>
</body>
</html>
