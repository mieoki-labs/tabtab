<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabTab</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #16191d; --ink-2: #5b6470; --line: #e3e6ea; --accent: #2455e6; --on: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111316; --card: #1a1d21; --ink: #eef0f2; --ink-2: #9aa3ae; --line: #2c3036; --accent: #7ea2ff; --on: #0d1422; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { width: 100%; max-width: 480px; padding: 36px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  svg { display: block; margin: 0 auto 20px; }
  h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.015em; }
  p { margin: 0 0 22px; color: var(--ink-2); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  a { padding: 10px 18px; border-radius: 9px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); color: var(--ink); }
  a.primary { background: var(--accent); border-color: var(--accent); color: var(--on); }
  @media (max-width: 480px) { main { padding: 24px 20px; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" width="48" height="48" aria-hidden="true"><defs><clipPath id="LOGO"><rect width="32" height="32" rx="7.5"/></clipPath></defs><g clip-path="url(#LOGO)"><rect width="32" height="32" fill="#2455E6"/><path d="M0 32V9h12a6 6 0 0 1 6 6v17z" fill="#fff"/><path d="M32 32V9h-3a6 6 0 0 0-6 6v17z" fill="#B7C8FB"/><circle cx="9" cy="15.5" r="2.8" fill="#2455E6"/></g></svg>
  <h1 data-ko="TabTab을 삭제했어요">Sorry to see you go</h1>
  <p data-ko="무엇이 아쉬웠는지 알려주시면 더 좋게 만들게요. 의견은 짧은 폼으로 보낼 수 있어요.">Tell me what fell short and I'll work on it. It only takes a short form.</p>
  <div class="actions">
    <a class="primary" id="feedback" target="_blank" rel="noopener" data-ko="의견 보내기">Send feedback</a>
    <a id="reinstall" target="_blank" rel="noopener" data-ko="다시 설치하기">Reinstall TabTab</a>
  </div>
</main>
<script>
  // 공개 전에 채운다. 비어 있는 버튼은 숨긴다
  const links = { feedback: 'https://tally.so/r/YjPAVW', reinstall: '' };
  if ((navigator.language || '').toLowerCase().startsWith('ko')) {
    document.documentElement.lang = 'ko';
    document.querySelectorAll('[data-ko]').forEach(n => { n.textContent = n.dataset.ko; });
  }
  for (const [id, url] of Object.entries(links)) {
    const a = document.getElementById(id);
    if (url) a.href = url; else a.hidden = true;
  }
</script>
</body>
</html>
