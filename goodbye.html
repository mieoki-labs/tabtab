<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabTab</title>
<style>
  /* Tally 폼 글자가 어두워서 다크 모드 없이 밝은 화면으로 고정한다 */
  :root { color-scheme: light; --bg: #f6f7f9; --card: #fff; --ink: #16191d; --ink-2: #5b6470; --line: #e3e6ea; --accent: #2455e6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { width: 100%; max-width: 500px; padding: 32px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .mark { position: relative; width: 48px; height: 48px; margin: 0 auto 16px; }
  .mark svg { display: block; }
  .tear { position: absolute; right: -10px; bottom: -6px; font-size: 22px; line-height: 1; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.015em; text-align: center; }
  .lead { margin: 0 0 16px; color: var(--ink-2); text-align: center; }
  iframe { display: block; width: 100%; height: 600px; border: 0; }
  .note { margin: 12px 0 0; color: var(--ink-2); font-size: 13px; text-align: center; }
  .note a { color: var(--accent); }
  @media (max-width: 480px) { main { padding: 24px 16px; } }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 32 32" width="48" height="48" aria-hidden="true"><defs><clipPath id="LOGO"><rect width="32" height="32" rx="7.5"/></clipPath></defs><g clip-path="url(#LOGO)"><rect width="32" height="32" fill="#2455E6"/><path d="M0 32V9h12a6 6 0 0 1 6 6v17z" fill="#fff"/><path d="M32 32V9h-3a6 6 0 0 0-6 6v17z" fill="#B7C8FB"/><circle cx="9" cy="15.5" r="2.8" fill="#2455E6"/></g></svg>
    <span class="tear" aria-hidden="true">😢</span>
  </div>
  <h1 data-ko="TabTab을 삭제했어요">Sorry to see you go</h1>
  <p class="lead" data-ko="이유를 알려주시면 큰 도움이 돼요. 선택 사항이에요.">Mind telling me why? It's completely optional.</p>
  <iframe src="https://tally.so/embed/rD5XkM?hideTitle=1&amp;transparentBackground=1&amp;alignLeft=1" title="TabTab feedback" loading="lazy"></iframe>
  <p class="note"><span data-ko="익명이에요. 이름이나 이메일은 필요 없어요.">Anonymous. No name or email needed.</span> <a id="reinstall" target="_blank" rel="noopener" data-ko="다시 설치하기" hidden>Reinstall TabTab</a></p>
</main>
<script>
  // 스토어 주소가 나오면 채운다. 비어 있으면 링크를 숨긴다
  const REINSTALL_URL = '';
  if ((navigator.language || '').toLowerCase().startsWith('ko')) {
    document.documentElement.lang = 'ko';
    document.querySelectorAll('[data-ko]').forEach(n => { n.textContent = n.dataset.ko; });
  }
  if (REINSTALL_URL) {
    const a = document.getElementById('reinstall');
    a.href = REINSTALL_URL;
    a.hidden = false;
  }
</script>
</body>
</html>
